<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>LINE Rich Menu — SME OPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: #1a1a2e; font-family: -apple-system, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    padding: 40px;
  }

  .rich-menu {
    width: 2500px; height: 1686px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
    background: #f5f5f5;
  }

  .cell {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
  }

  .icon-box {
    width: 520px; height: 520px; border-radius: 90px;
    display: flex; align-items: center; justify-content: center;
    /* no shadow — avoids html2canvas artifacts */
  }
  .icon-box svg { width: 270px; height: 270px; }

  .zh {
    font-size: 100px; font-weight: 800; letter-spacing: 8px;
    color: #3a3a4a;
  }
  .zh-sm {
    font-size: 84px;
  }
  .en {
    font-size: 36px; font-weight: 600; letter-spacing: 5px;
    text-transform: uppercase; margin-top: -14px;
    color: #8a8a9a;
  }

  /* ── Unified pastel themes (flat colors for clean export) ── */
  .t-clock { background: #e4f5f7; }
  .t-clock .icon-box { background: #c8e8ed; }
  .t-clock svg { color: #0e9aa7; stroke: #0e9aa7; }

  .t-hr { background: #e3ecfa; }
  .t-hr .icon-box { background: #ced9f0; }
  .t-hr svg { color: #3b5ec1; stroke: #3b5ec1; }

  .t-wms { background: #fef3e2; }
  .t-wms .icon-box { background: #f8ddb5; }
  .t-wms svg { color: #e67e22; stroke: #e67e22; }

  .t-schedule { background: #f0e6f6; }
  .t-schedule .icon-box { background: #dcc8eb; }
  .t-schedule svg { color: #8e44ad; stroke: #8e44ad; }

  .t-crm { background: #fce4e4; }
  .t-crm .icon-box { background: #f0caca; }
  .t-crm svg { color: #cb4335; stroke: #cb4335; }

  .t-sales { background: #e0f5e9; }
  .t-sales .icon-box { background: #bfe8cf; }
  .t-sales svg { color: #27ae60; stroke: #27ae60; }
</style>
</head>
<body>

<div class="rich-menu">
  <!-- 左上：打卡 -->
  <div class="cell t-clock">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
    <div class="zh zh-sm">快速打卡</div>
    <div class="en">Quick Clock</div>
  </div>

  <!-- 中上：HR -->
  <div class="cell t-hr">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <polyline points="9 16 11 18 15 14"/>
      </svg>
    </div>
    <div class="zh">HR</div>
    <div class="en">人事管理</div>
  </div>

  <!-- 右上：WMS -->
  <div class="cell t-wms">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
    </div>
    <div class="zh">WMS</div>
    <div class="en">倉儲管理</div>
  </div>

  <!-- 左下：班表 -->
  <div class="cell t-schedule">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="14" x2="8" y2="14.01"/>
        <line x1="12" y1="14" x2="12" y2="14.01"/>
        <line x1="16" y1="14" x2="16" y2="14.01"/>
        <line x1="8" y1="18" x2="8" y2="18.01"/>
        <line x1="12" y1="18" x2="12" y2="18.01"/>
      </svg>
    </div>
    <div class="zh zh-sm">我的班表</div>
    <div class="en">My Schedule</div>
  </div>

  <!-- 中下：CRM -->
  <div class="cell t-crm">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
        <path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
    </div>
    <div class="zh">CRM</div>
    <div class="en">客戶管理</div>
  </div>

  <!-- 右下：Sales -->
  <div class="cell t-sales">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
      </svg>
    </div>
    <div class="zh">SALES</div>
    <div class="en">銷售管理</div>
  </div>
</div>

<button id="downloadBtn" onclick="downloadImage()" type="button" style="
  margin-top: 24px; padding: 14px 40px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #22d3ee, #3b82f6); color: #fff;
  font-size: 15px; font-weight: 700; cursor: pointer;
">下載圖片 (2500 x 1686)</button>

<div style="color: #94a3b8; font-size: 12px; margin-top: 12px;">
  打開此檔案後按「下載圖片」→ 上傳至 LINE Official Account Manager → Rich Menu
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  async function downloadImage() {
    const btn = document.getElementById('downloadBtn');
    btn.textContent = '產生中...';
    btn.disabled = true;
    const el = document.querySelector('.rich-menu');
    const canvas = await html2canvas(el, { scale: 1, useCORS: true, backgroundColor: null, width: 2500, height: 1686 });
    const link = document.createElement('a');
    link.download = 'sme-ops-rich-menu-2500x1686.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.textContent = '下載圖片 (2500 x 1686)';
    btn.disabled = false;
  }
</script>
</body>
</html>
